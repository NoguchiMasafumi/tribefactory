<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>西永福駅の表示</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 100vh; width: 100%; }
        body { margin: 0; padding: 0; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        async function initMap() {
            const map = L.map('map').setView([35.67963, 139.6391], 16);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);

            const response = await fetch('N02-22_Station.geojson');
            const geojsonData = await response.json();
            
            const target = geojsonData.features.find(f => f.properties.N02_005 === "西永福");
            if (!target) return;

            const coords = target.geometry.coordinates;
            const centerLng = (coords[0][0] + coords[1][0]) / 2;
            const centerLat = (coords[0][1] + coords[1][1]) / 2;

            L.marker([centerLat, centerLng])
                .addTo(map)
                .bindPopup(target.properties.N02_005 + "駅 (" + target.properties.N02_003 + ")")
                .openPopup();
                
            map.setView([centerLat, centerLng], 16);
        }
        initMap();
    </script>
</body>
</html>
