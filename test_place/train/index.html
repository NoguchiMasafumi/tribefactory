<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>西永福駅の表示</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 100vh; width: 100%; }
        body { margin: 0; padding: 0; }
        .leaflet-tile { filter: opacity(0.4) grayscale(0.8); }
        .huge-marker { background: #ffffff !important; border: 5px solid #000000 !important; border-radius: 50%; box-shadow: 0 0 15px rgba(0,0,0,0.5); z-index: 1000 !important; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        async function initMap() {
            const map = L.map('map').setView([35.67963, 139.6391], 17);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);

            const response = await fetch('N02-22_Station.geojson');
            const geojsonData = await response.json();
            
            const target = geojsonData.features.find(f => f.properties.N02_005 === "西永福");
            if (!target) return;

            const coords = target.geometry.coordinates;
            const centerLng = (coords[0][0] + coords[1][0]) / 2;
            const centerLat = (coords[0][1] + coords[1][1]) / 2;
            
            const latlngs = coords.map(coord => [coord[1], coord[0]]);

            L.polyline(latlngs, {
                color: '#ff0000',
                weight: 16,
                opacity: 0.9,
                lineCap: 'round'
            }).addTo(map);

            const bigIcon = L.divIcon({
                className: 'huge-marker',
                iconSize: [40, 40],
                iconAnchor: [20, 20]
            });

            L.marker([centerLat, centerLng], { icon: bigIcon })
                .addTo(map)
                .bindPopup("<b>" + target.properties.N02_005 + "駅</b><br>" + target.properties.N02_003)
                .openPopup();
                
            map.setView([centerLat, centerLng], 17);
        }
        initMap();
    </script>
</body>
</html>
