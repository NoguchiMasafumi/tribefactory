<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>西永福駅の表示</title>
    <style>
        #map { height: 100vh; width: 100%; }
        body { margin: 0; padding: 0; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        async function initMap() {
            const response = await fetch('N02-22_Station.geojson');
            const geojsonData = await response.json();
            
            const target = geojsonData.features.find(f => f.properties.N02_005 === "西永福");
            if (!target) return;

            const coords = target.geometry.coordinates;
            const centerLng = (coords[0][0] + coords[1][0]) / 2;
            const centerLat = (coords[0][1] + coords[1][1]) / 2;
            const stationPos = { lat: centerLat, lng: centerLng };

            const map = new google.maps.Map(document.getElementById("map"), {
                zoom: 16,
                center: stationPos,
            });

            new google.maps.Marker({
                position: stationPos,
                map: map,
                title: target.properties.N02_005 + "駅 (" + target.properties.N02_003 + ")"
            });
        }
    </script>
    <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initMap" async defer></script>
</body>
</html>
