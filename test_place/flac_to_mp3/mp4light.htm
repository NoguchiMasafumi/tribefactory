<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>MP4 Compressor</title>
</head>
<body>
    <input type="file" id="uploader" accept="video/mp4">
    <div id="progress">待機中</div>
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
    <script>
        const progress = document.getElementById('progress');
        const { createFFmpeg, fetchFile } = FFmpeg;
        const ffmpeg = createFFmpeg({
            log: true,
            progress: ({ ratio }) => {
                progress.innerText = `圧縮中: ${Math.round(ratio * 100)}%`;
            }
        });
        const uploader = document.getElementById('uploader');
        uploader.addEventListener('change', async () => {
            const file = uploader.files[0];
            if (!file) return;
            progress.innerText = '準備中...';
            if (!ffmpeg.isLoaded()) await ffmpeg.load();
            ffmpeg.FS('writeFile', 'input.mp4', await fetchFile(file));
            await ffmpeg.run('-i', 'input.mp4', '-vcodec', 'libx264', '-crf', '28', 'output.mp4');
            const data = ffmpeg.FS('readFile', 'output.mp4');
            const blob = new Blob([data.buffer], { type: 'video/mp4' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'compressed.mp4';
            a.click();
            progress.innerText = '完了！';
        });
    </script>
</body>
</html>
